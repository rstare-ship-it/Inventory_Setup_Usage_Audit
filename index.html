<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inventory Scorecard — Home</title>
  <link rel="stylesheet" href="/Inventory_Setup_Usage_Audit/css/scorecard.css">
  <style>
    .lookup-form { margin: 1.5rem 0; display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; }
    .lookup-form input { padding: 0.5rem 0.75rem; font-size: 1rem; min-width: 12rem; }
    .lookup-form button { padding: 0.5rem 1rem; font-size: 1rem; cursor: pointer; }
    .lookup-error { color: #c00; margin-top: 0.5rem; }
    .scorecard-summary { margin-top: 1rem; }
    .area-row { display: flex; align-items: center; gap: 0.5rem; padding: 0.25rem 0; }
    .area-status { font-weight: 600; min-width: 5rem; }
    .area-status.green { color: #0a0; }
    .area-status.yellow { color: #880; }
    .area-status.review { color: #f80; }
    .area-status.red { color: #c00; }
    .action-plan { list-style: none; padding-left: 0; }
    .action-plan li { padding: 0.35rem 0; border-bottom: 1px solid #eee; }
    .scorecard-page-wrap { margin-top: 1.5rem; }
  </style>
</head>
<body>
  <h1>Inventory scorecard</h1>
  <p>Enter a <strong>tenant name</strong>, <strong>tenant ID</strong>, or <strong>tenant group name</strong> to view an audit scorecard.</p>
  <form class="lookup-form" id="lookup-form">
    <input type="text" id="tenant-input" placeholder="e.g. 444875142, westernheating, or T3 Services Group" autofocus>
    <button type="button" onclick="runLookup()">View scorecard</button>
  </form>
  <div id="lookup-error" class="lookup-error" aria-live="polite" style="min-height: 1.5em;"></div>
  <div id="scorecard-container" class="scorecard-page-wrap" hidden></div>

  <!-- Use path from root so script loads even when page URL has no trailing slash -->
  <script src="/Inventory_Setup_Usage_Audit/js/lookup.js"></script>
</body>
</html>
