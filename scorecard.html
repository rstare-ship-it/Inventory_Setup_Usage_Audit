<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inventory Scorecard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:             #f9f8f7;
      --surface:        #ffffff;
      --nav-bg:         #0f0f10;
      --accent:         #5b4fff;
      --accent-light:   rgba(91,79,255,0.07);
      --accent-border:  rgba(91,79,255,0.18);
      --text:           #18181b;
      --text-muted:     #71717a;
      --text-faint:     #a1a1aa;
      --border:         #e4e4e7;
      --border-strong:  #d4d4d8;
      --shadow-sm:      0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);

      --green:        #16a34a; --green-bg:  #f0fdf4; --green-border: #86efac; --green-text:  #15803d;
      --yellow:       #ca8a04; --yellow-bg: #fefce8; --yellow-border:#fde047; --yellow-text: #a16207;
      --review:       #ea580c; --review-bg: #fff7ed; --review-border:#fed7aa; --review-text: #c2410c;
      --red:          #dc2626; --red-bg:    #fef2f2; --red-border:   #fca5a5; --red-text:    #b91c1c;

      --status-stripe: var(--border);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.5;
    }

    /* ── NAV ── */
    nav {
      background: var(--nav-bg);
      border-top: 3px solid var(--accent);
      padding: 0 2rem;
      display: flex; align-items: center; height: 48px; gap: 0.75rem;
      position: sticky; top: 0; z-index: 100;
    }
    .nav-back {
      color: rgba(255,255,255,0.45); text-decoration: none; font-size: 13px;
      font-weight: 500; display: flex; align-items: center; gap: 0.35rem;
      white-space: nowrap; transition: color 0.15s;
    }
    .nav-back:hover { color: rgba(255,255,255,0.9); }
    .nav-sep { color: rgba(255,255,255,0.12); }
    .nav-title {
      color: rgba(255,255,255,0.35); font-size: 13px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    /* ── HERO ── */
    .hero {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      border-top: 3px solid var(--status-stripe);
      padding: 1.75rem 2rem 1.5rem;
    }
    .hero-inner { max-width: 1100px; margin: 0 auto; }
    .hero-label {
      display: inline-flex; align-items: center;
      background: var(--accent-light); border: 1px solid var(--accent-border);
      color: var(--accent); font-size: 0.68rem; font-weight: 600;
      letter-spacing: 0.08em; text-transform: uppercase;
      padding: 0.18rem 0.55rem; border-radius: 4px; margin-bottom: 0.7rem;
    }
    .hero h1 {
      font-family: 'Space Grotesk', system-ui, sans-serif;
      font-size: 1.7rem; font-weight: 700; color: var(--text);
      letter-spacing: -0.025em; line-height: 1.2; margin-bottom: 0.5rem;
    }
    .hero-meta { display: flex; gap: 0.45rem; flex-wrap: wrap; margin-top: 0.5rem; margin-bottom: 0.85rem; }
    .meta-chip {
      font-size: 12px; font-weight: 500; color: var(--text-muted);
      background: var(--bg); border: 1px solid var(--border);
      padding: 0.15rem 0.5rem; border-radius: 4px;
      font-variant-numeric: tabular-nums;
    }
    .hero-status-row { display: flex; gap: 6px; flex-wrap: wrap; }
    .hbadge {
      padding: 0.2rem 0.65rem; border-radius: 4px;
      font-size: 11.5px; font-weight: 600; letter-spacing: 0.01em;
    }
    .hbadge.red    { background: var(--red-bg);    border: 1px solid var(--red-border);    color: var(--red-text); }
    .hbadge.review { background: var(--review-bg); border: 1px solid var(--review-border); color: var(--review-text); }
    .hbadge.yellow { background: var(--yellow-bg); border: 1px solid var(--yellow-border); color: var(--yellow-text); }
    .hbadge.green  { background: var(--green-bg);  border: 1px solid var(--green-border);  color: var(--green-text); }

    /* ── MAIN CONTENT ── */
    main { max-width: 1100px; margin: 0 auto; padding: 1.75rem 1.5rem 3.5rem; }

    .section-label {
      font-size: 11px; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.1em; color: var(--text-muted);
      margin: 2rem 0 0.85rem;
    }

    /* ── SCORE TILES ── */
    .tiles-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(205px, 1fr));
      gap: 8px; margin-bottom: 0.25rem;
    }
    .tile {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; padding: 0.8rem 1rem;
      display: flex; align-items: center; justify-content: space-between; gap: 0.5rem;
      transition: border-color 0.15s;
    }
    .tile:hover { border-color: var(--border-strong); }
    .tile-left { display: flex; align-items: center; gap: 0.5rem; }
    .tile-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    .tile.red    .tile-dot { background: var(--red); }
    .tile.review .tile-dot { background: var(--review); }
    .tile.yellow .tile-dot { background: var(--yellow); }
    .tile.green  .tile-dot { background: var(--green); }
    .tile-name { font-size: 13px; font-weight: 500; color: var(--text); }
    .tbadge {
      font-size: 11px; font-weight: 600; padding: 0.15rem 0.5rem; border-radius: 4px;
      white-space: nowrap; flex-shrink: 0;
    }
    .tbadge.red    { background: var(--red-bg);    color: var(--red-text);    border: 1px solid var(--red-border); }
    .tbadge.review { background: var(--review-bg); color: var(--review-text); border: 1px solid var(--review-border); }
    .tbadge.yellow { background: var(--yellow-bg); color: var(--yellow-text); border: 1px solid var(--yellow-border); }
    .tbadge.green  { background: var(--green-bg);  color: var(--green-text);  border: 1px solid var(--green-border); }

    /* ── CARDS ── */
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 10px; padding: 1.25rem 1.4rem; margin-bottom: 1rem;
    }
    .card-title {
      font-size: 11px; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.1em; color: var(--text-muted);
      margin-bottom: 1rem; padding-bottom: 0.6rem; border-bottom: 1px solid var(--border);
    }

    /* ── FINDINGS ── */
    .findings-area { margin-bottom: 1.25rem; }
    .findings-area:last-child { margin-bottom: 0; }
    .area-head {
      display: flex; align-items: center; gap: 0.5rem;
      font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 0.4rem;
    }
    .findings-list { list-style: none; display: flex; flex-direction: column; gap: 2px; }
    .findings-list li {
      padding: 0.35rem 0.65rem; font-size: 13px;
      border-radius: 5px; line-height: 1.45;
      display: flex; align-items: baseline; gap: 0.45rem;
    }
    .finding-ok     { background: var(--green-bg);  color: #166534; }
    .finding-warn   { background: var(--yellow-bg); color: #713f12; }
    .finding-review { background: var(--review-bg); color: #7c2d12; }
    .finding-err    { background: var(--red-bg);    color: var(--red-text); }
    .finding-ok::before     { content: '✓'; font-weight: 700; flex-shrink: 0; }
    .finding-warn::before   { content: '!'; font-weight: 700; flex-shrink: 0; }
    .finding-review::before { content: '○'; font-weight: 700; flex-shrink: 0; }
    .finding-err::before    { content: '✕'; font-weight: 700; flex-shrink: 0; }

    /* ── SETTINGS ── */
    .settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 3rem; }
    @media (max-width: 640px) { .settings-grid { grid-template-columns: 1fr; } }
    .setting-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0.3rem 0; border-bottom: 1px solid var(--border);
      font-size: 13px; gap: 0.5rem;
    }
    .setting-row:last-child { border-bottom: none; }
    .setting-label { color: var(--text-muted); }
    .setting-val { font-weight: 600; font-variant-numeric: tabular-nums; }
    .setting-val.on  { color: var(--green); }
    .setting-val.off { color: var(--text-faint); }

    /* ── READINESS BANNER ── */
    .readiness-banner {
      border-radius: 8px; padding: 0.9rem 1.1rem;
      display: flex; align-items: flex-start; gap: 0.75rem;
    }
    .readiness-banner.green { background: var(--green-bg); border: 1px solid var(--green-border); }
    .readiness-banner.red   { background: var(--red-bg);   border: 1px solid var(--red-border); }
    .readiness-icon { font-size: 1rem; line-height: 1.5; flex-shrink: 0; font-weight: 700; }
    .readiness-banner.green .readiness-icon { color: var(--green); }
    .readiness-banner.red   .readiness-icon { color: var(--red); }
    .readiness-body { flex: 1; }
    .readiness-title { font-size: 13px; font-weight: 700; margin-bottom: 0.25rem; }
    .readiness-banner.green .readiness-title { color: var(--green-text); }
    .readiness-banner.red   .readiness-title { color: var(--red-text); }
    .readiness-msg { font-size: 13px; line-height: 1.5; }
    .readiness-banner.green .readiness-msg { color: #166534; }
    .readiness-banner.red   .readiness-msg { color: var(--red-text); }

    /* ── ACTION PLAN ── */
    .action-list { padding-left: 1.3rem; }
    .action-list li {
      padding: 0.4rem 0; border-bottom: 1px solid var(--border);
      font-size: 13px; color: var(--text); line-height: 1.55;
    }
    .action-list li:last-child { border-bottom: none; }

    /* ── STATE MESSAGES ── */
    .state-msg { text-align: center; padding: 5rem 2rem; color: var(--text-muted); font-size: 15px; }
    .state-msg.error { color: var(--red); }

    /* ── RESPONSIVE ── */
    @media (max-width: 600px) {
      .hero h1 { font-size: 1.35rem; }
      main { padding: 1.25rem 1rem 2.5rem; }
    }
  </style>
</head>
<body>

  <nav>
    <a href="./" class="nav-back">← Scorecards</a>
    <span class="nav-sep">|</span>
    <span class="nav-title" id="nav-title">Loading…</span>
  </nav>

  <div id="hero" hidden>
    <div class="hero">
      <div class="hero-inner">
        <div class="hero-label">Inventory Audit</div>
        <h1 id="hero-name"></h1>
        <div class="hero-meta">
          <span id="meta-id"></span>
          <span id="meta-lookback"></span>
          <span id="meta-updated"></span>
        </div>
        <div class="hero-status-row" id="hero-badges"></div>
      </div>
    </div>
  </div>

  <main>
    <div id="state-loading" class="state-msg">Loading scorecard…</div>
    <div id="state-error"   class="state-msg error" hidden></div>

    <div id="body" hidden>
      <div class="section-label">Settings &amp; Configuration</div>
      <div class="card">
        <div class="card-title">Modules &amp; Feature Gates</div>
        <div class="settings-grid" id="settings-modules"></div>
      </div>
      <div class="card">
        <div class="card-title">Pricebook &amp; Setup Counts</div>
        <div class="settings-grid" id="settings-setup"></div>
      </div>

      <div id="readiness-section" hidden>
        <div class="section-label">Inventory Readiness</div>
        <div class="card" style="padding:1rem 1.1rem;">
          <div id="readiness-content"></div>
        </div>
      </div>

      <div class="section-label">Scorecard Overview</div>
      <div class="tiles-grid" id="tiles"></div>

      <div class="section-label">Findings by Area</div>
      <div class="card" id="findings-card">
        <div id="findings"></div>
      </div>

      <div class="section-label">Action Plan</div>
      <div class="card">
        <ol class="action-list" id="action-plan"></ol>
      </div>
    </div>
  </main>

  <script>
  (function () {
    'use strict';

    var STATUS_LABEL = { Green: 'Good', Yellow: 'On track', Review: 'Review', Red: 'Critical' };
    var STATUS_KEY   = { Green: 'green', Yellow: 'yellow', Review: 'review', Red: 'red' };

    var FG_LABELS = {
      item_requisitions:          'Item requisitions',
      requisition_closeout:       'Requisition closeout',
      install_requisitions:       'Requisition workflow (service)',
      transfers_to_jobs:          'Transfers to jobs',
      consignment:                'Consignment',
      purchase_approval_workflow: 'Purchase approval workflow',
      granular_wac:               'Granular WAC',
      stock_optimizer:            'Stock Optimizer'
    };
    var VALUATION  = { 0: 'Standard costing', 1: 'Weighted average', 2: 'Weighted avg (granular)' };
    var PO_COPY    = { 0: 'Add items at $0', 1: 'Add at receipt cost' };
    var PO_APPROVAL= { 0: 'PO total', 1: 'PO subtotal' };

    // ── Helpers ──────────────────────────────────────────────────────────────
    function esc(s) {
      return (s == null) ? '' : String(s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
    function slugify(s) {
      return (s || '').toLowerCase().trim()
        .replace(/[^\w\s-]/g, '').replace(/\s+/g, '-').replace(/-+/g, '-').slice(0, 80);
    }
    function el(id)        { return document.getElementById(id); }
    function html(id, h)   { var e = el(id); if (e) e.innerHTML = h; }
    function text(id, t)   { var e = el(id); if (e) e.textContent = t; }
    function show(id)      { var e = el(id); if (e) e.hidden = false; }
    function hide(id)      { var e = el(id); if (e) e.hidden = true; }

    // ── URL params ───────────────────────────────────────────────────────────
    var params = {};
    window.location.search.slice(1).split('&').forEach(function (p) {
      var kv = p.split('=');
      if (kv[0]) params[kv[0]] = decodeURIComponent((kv[1] || '').replace(/\+/g, ' '));
    });
    var tenantParam = (params.tenant_id || params.tenant || params.id || '').trim();

    // ── Base path & aggregate URL ────────────────────────────────────────────
    var BASE      = window.location.pathname.replace(/\/[^/]*$/, '/');
    var AGGREGATE = BASE + 'data/audit_aggregate.json';

    // ── Tenant lookup ────────────────────────────────────────────────────────
    function findTenant(data, query) {
      if (!query) return null;
      var byId   = data.tenants_by_id   || {};
      var bySlug = data.tenants_by_slug || {};
      if (/^\d+$/.test(query)) return byId[query] || null;
      return byId[bySlug[slugify(query)]] || null;
    }

    // ── Render helpers ───────────────────────────────────────────────────────
    function settingRow(label, val, onOff) {
      var cls = onOff ? (' ' + (val === 'On' || val === 'Yes' ? 'on' : 'off')) : '';
      return '<div class="setting-row">'
           + '<span class="setting-label">' + esc(label) + '</span>'
           + '<span class="setting-val' + cls + '">' + esc(val) + '</span>'
           + '</div>';
    }

    // ── Full render ──────────────────────────────────────────────────────────
    function render(t) {
      var name      = t.tenant_name || ('Tenant ' + t.tenant_id);
      var areas     = t.area_statuses    || {};
      var AREA_ORDER = Object.keys(areas).filter(function(a) { return a !== 'Readiness'; });
      var findings  = t.findings_by_area || {};
      var results   = t.results          || {};
      var plan      = t.action_plan      || [];

      // Status stripe
      var counts = { red: 0, review: 0, yellow: 0, green: 0 };
      Object.values(areas).forEach(function (s) {
        var k = STATUS_KEY[s]; if (k) counts[k]++;
      });
      var stripeColor = counts.red > 0 ? 'var(--red)' :
                        counts.review > 0 ? 'var(--review)' :
                        counts.yellow > 0 ? 'var(--yellow)' : 'var(--green)';
      document.documentElement.style.setProperty('--status-stripe', stripeColor);

      // Hero
      text('nav-title', name);
      document.title = 'Inventory Scorecard — ' + name;
      text('hero-name', name);
      html('meta-id',       '<span class="meta-chip">ID ' + esc(String(t.tenant_id)) + '</span>');
      html('meta-lookback', '<span class="meta-chip">Last ' + (t.lookback_days || 90) + ' days</span>');
      if (t.updated_at) html('meta-updated', '<span class="meta-chip">Updated ' + t.updated_at.substring(0, 10) + '</span>');

      var badges = '';
      if (counts.red)    badges += '<span class="hbadge red">'    + counts.red    + ' Critical</span>';
      if (counts.review) badges += '<span class="hbadge review">' + counts.review + ' Review</span>';
      if (counts.yellow) badges += '<span class="hbadge yellow">' + counts.yellow + ' On Track</span>';
      if (counts.green)  badges += '<span class="hbadge green">'  + counts.green  + ' Good</span>';
      html('hero-badges', badges);
      show('hero');

      // Tiles
      var tilesHtml = '';
      AREA_ORDER.forEach(function (area) {
        var s = areas[area];
        if (!s || s === 'N/A') return;
        var k = STATUS_KEY[s] || 'green';
        tilesHtml += '<div class="tile ' + k + '">'
          + '<div class="tile-left"><span class="tile-dot"></span><span class="tile-name">' + esc(area) + '</span></div>'
          + '<span class="tbadge ' + k + '">' + esc(STATUS_LABEL[s] || s) + '</span>'
          + '</div>';
      });
      html('tiles', tilesHtml);

      // Findings
      var findingsHtml = '';
      AREA_ORDER.forEach(function (area) {
        var s = areas[area];
        if (!s || s === 'N/A') return;
        var f = findings[area] || {};
        var allItems = [].concat(f.red || [], f.review || [], f.yellow || [], f.green || []);
        if (!allItems.length) return;
        var k = STATUS_KEY[s] || 'green';
        findingsHtml += '<div class="findings-area">'
          + '<div class="area-head">' + esc(area)
          + ' <span class="tbadge ' + k + '">' + esc(STATUS_LABEL[s] || s) + '</span></div>'
          + '<ul class="findings-list">';
        (f.red    || []).forEach(function (t) { findingsHtml += '<li class="finding-err">'    + esc(t) + '</li>'; });
        (f.review || []).forEach(function (t) { findingsHtml += '<li class="finding-review">' + esc(t) + '</li>'; });
        (f.yellow || []).forEach(function (t) { findingsHtml += '<li class="finding-warn">'   + esc(t) + '</li>'; });
        (f.green  || []).forEach(function (t) { findingsHtml += '<li class="finding-ok">'     + esc(t) + '</li>'; });
        findingsHtml += '</ul></div>';
      });
      html('findings', findingsHtml || '<p style="color:var(--text-faint);font-size:13px;padding:0.5rem 0">No findings available.</p>');

      // Settings — modules
      var cfg = results.readiness_config || {};
      var fg  = results.feature_gates    || {};
      var modHtml = '';
      modHtml += settingRow('Purchasing module', cfg.purchasing_module_on ? 'On' : 'Off', true);
      modHtml += settingRow('Inventory module',  cfg.inventory_module_on  ? 'On' : 'Off', true);
      Object.keys(FG_LABELS).forEach(function (k) {
        if (fg[k] !== undefined) modHtml += settingRow(FG_LABELS[k], fg[k] ? 'On' : 'Off', true);
      });
      html('settings-modules', modHtml);

      // Settings — setup
      var setup = results.setup_data         || {};
      var isinv = results.isinventory_counts || {};
      var inv   = results.inventory_settings || {};
      var setupHtml = '';
      if (setup.truck_total     != null) setupHtml += settingRow('Trucks with template',     (setup.truck_with_template     || 0) + ' / ' + setup.truck_total,     false);
      if (setup.warehouse_total != null) setupHtml += settingRow('Warehouses with template', (setup.warehouse_with_template || 0) + ' / ' + setup.warehouse_total, false);
      if (isinv.active_materials_count != null) {
        setupHtml += settingRow('Materials (total)',        isinv.active_materials_count,         false);
        setupHtml += settingRow('Materials (IsInventory)',  isinv.materials_isinventory_count || 0, false);
      }
      if (inv.InventoryValuationMethod !== undefined)
        setupHtml += settingRow('Valuation method', VALUATION[inv.InventoryValuationMethod] || String(inv.InventoryValuationMethod), false);
      if (inv.PoItemCostCopyOption !== undefined)
        setupHtml += settingRow('PO cost copy', PO_COPY[inv.PoItemCostCopyOption] || String(inv.PoItemCostCopyOption), false);
      var start = results.inventory_tracking_start_date;
      if (start) setupHtml += settingRow('Tracking start date', String(start).substring(0, 10), false);
      html('settings-setup', setupHtml || '<p style="color:var(--text-faint);font-size:13px">No setup data.</p>');

      // Readiness banner
      var rf = (findings['Readiness'] || {});
      var rMsgs = (rf.green || []).concat(rf.red || []);
      if (!t.is_live && rMsgs.length) {
        var isGreen = (rf.green || []).length > 0 && !(rf.red || []).length;
        var cls     = isGreen ? 'green' : 'red';
        var icon    = isGreen ? '✓' : '✕';
        var title   = isGreen ? 'Ready to advance' : 'Action required';
        var bannerHtml = '<div class="readiness-banner ' + cls + '">'
          + '<div class="readiness-icon">' + icon + '</div>'
          + '<div class="readiness-body">'
          + '<div class="readiness-title">' + title + '</div>'
          + '<div class="readiness-msg">' + esc(rMsgs[0]) + '</div>'
          + '</div></div>';
        html('readiness-content', bannerHtml);
        show('readiness-section');
      } else {
        hide('readiness-section');
      }

      // Action plan
      var actionHtml = '';
      if (plan.length) {
        plan.forEach(function (item) {
          var t = typeof item === 'string' ? item : ((item && item.action) || String(item));
          actionHtml += '<li>' + esc(t) + '</li>';
        });
      } else {
        actionHtml = '<li style="list-style:none;padding:0.5rem 0;color:var(--text-faint)">No specific actions — keep up current practices.</li>';
      }
      html('action-plan', actionHtml);

      hide('state-loading');
      show('body');
    }

    function showError(msg) {
      hide('state-loading');
      var e = el('state-error');
      if (e) { e.textContent = msg; e.hidden = false; }
    }

    // ── Boot ─────────────────────────────────────────────────────────────────
    if (!tenantParam) {
      showError('No tenant specified. Add ?tenant_id=YOUR_TENANT_ID to the URL, or go back and search.');
      return;
    }

    fetch(AGGREGATE)
      .then(function (r) {
        if (!r.ok) throw new Error('Could not load aggregate data (' + r.status + ')');
        return r.json();
      })
      .then(function (data) {
        var tenant = findTenant(data, tenantParam);
        if (!tenant) throw new Error('No scorecard found for "' + tenantParam + '".');
        render(tenant);
      })
      .catch(function (err) {
        showError(err.message || 'Failed to load scorecard.');
      });

  }());
  </script>
</body>
</html>
