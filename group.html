<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Group Scorecard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:            #f9f8f7;
      --surface:       #ffffff;
      --nav-bg:        #0f0f10;
      --accent:        #5b4fff;
      --accent-light:  rgba(91,79,255,0.07);
      --accent-border: rgba(91,79,255,0.18);
      --text:          #18181b;
      --text-muted:    #71717a;
      --text-faint:    #a1a1aa;
      --border:        #e4e4e7;
      --border-strong: #d4d4d8;

      --green:        #16a34a; --green-bg:  #f0fdf4; --green-border: #86efac; --green-text:  #15803d;
      --yellow:       #ca8a04; --yellow-bg: #fefce8; --yellow-border:#fde047; --yellow-text: #a16207;
      --review:       #ea580c; --review-bg: #fff7ed; --review-border:#fed7aa; --review-text: #c2410c;
      --red:          #dc2626; --red-bg:    #fef2f2; --red-border:   #fca5a5; --red-text:    #b91c1c;
      --na-bg:        #f4f4f5; --na:        #71717a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.5;
    }

    /* ── NAV ── */
    nav {
      background: var(--nav-bg); border-top: 3px solid var(--accent);
      padding: 0 2rem; height: 48px;
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 100;
    }
    .nav-logo {
      font-family: 'Space Grotesk', system-ui, sans-serif;
      color: white; font-size: 15px; font-weight: 700; letter-spacing: -0.01em;
    }
    .nav-logo span { color: rgba(255,255,255,0.38); font-weight: 500; }
    .nav-back {
      color: rgba(255,255,255,0.45); font-size: 13px; text-decoration: none;
      display: flex; align-items: center; gap: 0.35rem; transition: color 0.15s;
    }
    .nav-back:hover { color: rgba(255,255,255,0.9); }

    /* ── HERO ── */
    .hero {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 1.75rem 2rem 1.5rem;
    }
    .hero-inner { max-width: 1000px; margin: 0 auto; }
    .hero-label {
      display: inline-flex; align-items: center;
      background: var(--accent-light); border: 1px solid var(--accent-border);
      color: var(--accent); font-size: 0.68rem; font-weight: 600;
      letter-spacing: 0.08em; text-transform: uppercase;
      padding: 0.18rem 0.55rem; border-radius: 4px; margin-bottom: 0.65rem;
    }
    .hero h1 {
      font-family: 'Space Grotesk', system-ui, sans-serif;
      font-size: 1.6rem; font-weight: 700; color: var(--text);
      letter-spacing: -0.025em; line-height: 1.2; margin-bottom: 0.3rem;
    }
    .hero-meta {
      color: var(--text-muted); font-size: 13px; margin-bottom: 1.1rem;
    }
    .hero-meta span + span::before { content: '·'; margin: 0 0.45rem; }

    /* ── STATS STRIP ── */
    .stats-strip { display: flex; gap: 0.6rem; flex-wrap: wrap; }
    .stat-pill {
      display: flex; align-items: center; gap: 0.45rem;
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 6px; padding: 0.3rem 0.7rem; font-size: 13px;
    }
    .stat-pill .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    .stat-pill .dot-red    { background: var(--red); }
    .stat-pill .dot-review { background: var(--review); }
    .stat-pill .dot-yellow { background: var(--yellow); }
    .stat-pill .dot-green  { background: var(--green); }
    .stat-pill .stat-num { font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
    .stat-pill .stat-lbl { color: var(--text-muted); }
    .health-pill { border-color: var(--accent-border); background: var(--accent-light); }
    .health-pill .stat-num { color: var(--accent); }
    .health-pill .stat-lbl { color: var(--accent); opacity: 0.75; }

    /* ── MAIN ── */
    main { max-width: 1000px; margin: 0 auto; padding: 2rem 1.5rem 3.5rem; }

    .section-label {
      font-size: 11px; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.1em; color: var(--text-muted); margin: 0 0 0.85rem;
    }

    /* ── CARDS ── */
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 10px; padding: 1.25rem 1.4rem; margin-bottom: 1.25rem;
    }
    .card-title { font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 0.6rem; }
    .card-desc  { font-size: 13px; color: var(--text-muted); margin-bottom: 0.75rem; }

    /* ── TWO-COL LAYOUT ── */
    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
    @media (max-width: 640px) { .two-col { grid-template-columns: 1fr; } }

    /* ── STRUGGLES LIST ── */
    .struggles-list { list-style: none; padding: 0; margin: 0; }
    .struggles-list li {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0.4rem 0; border-bottom: 1px solid var(--border); font-size: 13px;
    }
    .struggles-list li:last-child { border-bottom: none; }
    .struggles-count {
      font-size: 11.5px; font-weight: 600; color: var(--text-muted);
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 9999px; padding: 0.1rem 0.5rem;
      white-space: nowrap; margin-left: 0.75rem; flex-shrink: 0;
    }

    /* ── ACTION LIST ── */
    .action-list { padding-left: 1.3rem; margin: 0; }
    .action-list li { margin: 0.4rem 0; font-size: 13px; line-height: 1.55; }
    .action-count { font-size: 11.5px; color: var(--text-faint); margin-left: 0.4rem; }

    /* ── STATUS TABLE ── */
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 700px; }
    thead th {
      font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em;
      color: var(--text-muted); padding: 0.55rem 0.75rem; text-align: left;
      border-bottom: 1.5px solid var(--border); white-space: nowrap;
      background: var(--bg);
    }
    thead th:first-child { min-width: 160px; }
    tbody td {
      padding: 0.45rem 0.75rem; border-bottom: 1px solid var(--border);
      font-size: 13px; vertical-align: middle;
    }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover td { background: var(--bg) !important; }
    .tenant-link {
      color: var(--accent); text-decoration: none; font-weight: 600;
    }
    .tenant-link:hover { text-decoration: underline; }

    /* ── STATUS BADGES ── */
    .badge {
      display: inline-flex; align-items: center; gap: 0.25rem;
      font-size: 11px; font-weight: 600; padding: 0.18rem 0.5rem;
      border-radius: 4px; white-space: nowrap;
    }
    .badge-dot { width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; }
    .badge-red    { background: var(--red-bg);    color: var(--red-text);    border: 1px solid var(--red-border); }
    .badge-red    .badge-dot { background: var(--red); }
    .badge-review { background: var(--review-bg); color: var(--review-text); border: 1px solid var(--review-border); }
    .badge-review .badge-dot { background: var(--review); }
    .badge-yellow { background: var(--yellow-bg); color: var(--yellow-text); border: 1px solid var(--yellow-border); }
    .badge-yellow .badge-dot { background: var(--yellow); }
    .badge-green  { background: var(--green-bg);  color: var(--green-text);  border: 1px solid var(--green-border); }
    .badge-green  .badge-dot { background: var(--green); }
    .badge-na     { background: var(--na-bg); color: var(--na); }

    td.s-red    { background: #fff8f8; }
    td.s-review { background: #fffaf7; }
    td.s-yellow { background: #fffef0; }
    td.s-green  { background: #f9fdf9; }
    td.s-na     { background: var(--bg); }

    /* ── LOADING / ERROR ── */
    .state-msg {
      text-align: center; padding: 3rem 1rem;
      color: var(--text-muted); font-size: 15px;
    }
    .state-msg strong {
      display: block; font-size: 20px;
      font-family: 'Space Grotesk', sans-serif;
      color: var(--text); margin-bottom: 0.4rem;
    }
  </style>
</head>
<body>

  <nav>
    <div class="nav-logo">Inventory<span> Scorecard</span></div>
    <a class="nav-back" href="index.html">← All tenants</a>
  </nav>

  <div class="hero">
    <div class="hero-inner">
      <div class="hero-label">Group Summary</div>
      <h1 id="hero-title">Loading…</h1>
      <div class="hero-meta" id="hero-meta"></div>
      <div class="stats-strip" id="stats-strip"></div>
    </div>
  </div>

  <main id="main">
    <div class="state-msg" id="loading-msg">
      <strong>Loading group data…</strong>
      Fetching tenant scorecards.
    </div>
  </main>

  <script>
  (function () {
    'use strict';

    var BASE = window.location.pathname.replace(/\/[^/]*$/, '/');
    var AGGREGATE_URL = BASE + 'data/audit_aggregate.json';
    var GROUPS_URL    = BASE + 'data/groups.json';

    var STATUS_ORDER = { Red: 0, Review: 1, Yellow: 2, Green: 3, 'N/A': 4 };
    var BADGE_CLASS  = { Red: 'badge-red', Review: 'badge-review', Yellow: 'badge-yellow', Green: 'badge-green', 'N/A': 'badge-na' };
    var BADGE_LABEL  = { Red: 'Critical', Review: 'Review', Yellow: 'On track', Green: 'Good', 'N/A': 'N/A' };
    var CELL_CLASS   = { Red: 's-red', Review: 's-review', Yellow: 's-yellow', Green: 's-green', 'N/A': 's-na' };

    function escHtml(s) {
      return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    // ── URL param ─────────────────────────────────────────────────────────────
    var params = {};
    window.location.search.slice(1).split('&').forEach(function (p) {
      var kv = p.split('=');
      if (kv[0]) params[decodeURIComponent(kv[0])] = decodeURIComponent((kv[1] || '').replace(/\+/g,' '));
    });
    var groupParam = (params.group || params.g || '').trim();

    if (!groupParam) {
      renderError('No group specified.', 'Use <code>group.html?group=SILA</code> or include a group name in the URL.');
      throw new Error('no group param');
    }

    // ── Fetch both JSON files in parallel ────────────────────────────────────
    Promise.all([
      fetch(GROUPS_URL).then(function(r){ if(!r.ok) throw new Error('groups.json: '+r.status); return r.json(); }),
      fetch(AGGREGATE_URL).then(function(r){ if(!r.ok) throw new Error('audit_aggregate.json: '+r.status); return r.json(); })
    ]).then(function(results) {
      var groupsData    = results[0];
      var aggregateData = results[1];
      render(groupsData, aggregateData);
    }).catch(function(err) {
      renderError('Could not load data.', err.message);
    });

    // ── Find the group ────────────────────────────────────────────────────────
    function findGroup(groupsData) {
      var needle = groupParam.toLowerCase().replace(/\s+/g, ' ').trim();
      return (groupsData.groups || []).find(function(g) {
        return g.group_id.toLowerCase() === needle ||
               g.group_name.toLowerCase() === needle ||
               g.group_id.toLowerCase().replace(/_/g,' ') === needle;
      });
    }

    // ── Main render ───────────────────────────────────────────────────────────
    function render(groupsData, aggregateData) {
      var group = findGroup(groupsData);
      if (!group) {
        renderError('Group not found.', 'No group matching "' + escHtml(groupParam) + '" in groups.json.');
        return;
      }

      document.title = group.group_name + ' — Group Scorecard';

      var byId = aggregateData.tenants_by_id || {};
      var tenants = group.tenant_ids.map(function(tid) {
        return byId[String(tid)] || null;
      }).filter(Boolean);

      tenants.sort(function(a,b){
        return (a.tenant_name||'').localeCompare(b.tenant_name||'');
      });

      var AREAS = Object.keys((tenants[0] || {}).area_statuses || {});

      // ── Compute stats ────────────────────────────────────────────────────
      var needAttn = tenants.filter(function(t) {
        return Object.values(t.area_statuses || {}).some(function(s){ return s === 'Red' || s === 'Review' || s === 'Yellow'; });
      }).length;

      var totalCells = 0, goodCells = 0;
      var areaCounts = {};
      AREAS.forEach(function(a) { areaCounts[a] = 0; });

      tenants.forEach(function(t) {
        var statuses = t.area_statuses || {};
        AREAS.forEach(function(a) {
          var s = statuses[a];
          if (!s || s === 'N/A') return;
          totalCells++;
          if (s === 'Green') { goodCells++; }
          else { areaCounts[a] = (areaCounts[a] || 0) + 1; }
        });
      });

      var healthPct   = totalCells > 0 ? Math.round(goodCells / totalCells * 100) : 0;
      var healthLabel = healthPct >= 80 ? 'Healthy' : healthPct >= 60 ? 'Fair' : healthPct >= 40 ? 'Needs work' : 'Critical';

      var statusCounts = { Red: 0, Review: 0, Yellow: 0, Green: 0 };
      tenants.forEach(function(t) {
        var s = t.area_statuses || {};
        var worst = worstStatus(s);
        if (worst && worst !== 'N/A') statusCounts[worst]++;
      });

      // ── Hero ─────────────────────────────────────────────────────────────
      document.getElementById('hero-title').textContent = group.group_name;
      document.getElementById('hero-meta').innerHTML =
        '<span>' + tenants.length + ' tenant' + (tenants.length !== 1 ? 's' : '') + '</span>' +
        '<span>Last 90 days</span>' +
        '<span>' + needAttn + ' of ' + tenants.length + ' need attention</span>';

      var strip = document.getElementById('stats-strip');
      strip.innerHTML =
        pill('dot-red',    statusCounts.Red,    'critical') +
        pill('dot-review', statusCounts.Review, 'review') +
        pill('dot-yellow', statusCounts.Yellow, 'on track') +
        pill('dot-green',  statusCounts.Green,  'good') +
        '<div class="stat-pill health-pill"><span class="stat-num">' + healthPct + '%</span><span class="stat-lbl">&nbsp;health — ' + healthLabel + '</span></div>';

      // ── Build main content ───────────────────────────────────────────────
      var main = document.getElementById('main');
      main.innerHTML = '';

      var struggles = AREAS.map(function(a) {
        return { area: a, count: areaCounts[a] || 0 };
      }).filter(function(x){ return x.count >= 2; })
        .sort(function(a,b){ return b.count - a.count; });

      var actionMap = {};
      tenants.forEach(function(t) {
        (t.action_plan || []).forEach(function(item) {
          var key = (item.text || item).trim();
          if (!actionMap[key]) actionMap[key] = 0;
          actionMap[key]++;
        });
      });
      var actions = Object.keys(actionMap).map(function(k) {
        return { text: k, count: actionMap[k] };
      }).filter(function(x){ return x.count >= 2; })
        .sort(function(a,b){ return b.count - a.count; });

      var html = '';
      html += '<div class="section-label">Common struggles &amp; action plan</div>';
      html += '<div class="two-col card">';

      html += '<div>';
      html += '<div class="card-title">Common struggles</div>';
      html += '<p class="card-desc">Areas where multiple tenants need improvement.</p>';
      if (struggles.length) {
        html += '<ul class="struggles-list">';
        struggles.forEach(function(s) {
          html += '<li><span>' + escHtml(s.area) + '</span><span class="struggles-count">' + s.count + ' of ' + tenants.length + '</span></li>';
        });
        html += '</ul>';
      } else {
        html += '<p style="color:var(--text-faint);font-size:13px;">No widespread struggles — great work!</p>';
      }
      html += '</div>';

      html += '<div>';
      html += '<div class="card-title">Recommended actions</div>';
      html += '<p class="card-desc">Actions that apply to multiple tenants.</p>';
      if (actions.length) {
        html += '<ol class="action-list">';
        actions.forEach(function(a) {
          html += '<li>' + escHtml(a.text) + '<span class="action-count">(' + a.count + ' tenants)</span></li>';
        });
        html += '</ol>';
      } else {
        html += '<p style="color:var(--text-faint);font-size:13px;">No shared action items across tenants.</p>';
      }
      html += '</div>';
      html += '</div>';

      html += '<div class="section-label" style="margin-top:1.75rem;">Tenants by area</div>';
      html += '<div class="card" style="padding:0;overflow:hidden;">';
      html += '<div class="table-wrap">';
      html += '<table aria-label="Tenant scorecard status by area">';
      html += '<thead><tr>';
      html += '<th>Tenant</th>';
      AREAS.forEach(function(a) { html += '<th>' + escHtml(a) + '</th>'; });
      html += '</tr></thead>';
      html += '<tbody>';
      tenants.forEach(function(t) {
        var statuses = t.area_statuses || {};
        html += '<tr>';
        html += '<td><a class="tenant-link" href="scorecard.html?tenant_id=' + t.tenant_id + '">' + escHtml(t.tenant_name) + '</a></td>';
        AREAS.forEach(function(a) {
          var s    = statuses[a] || 'N/A';
          var cls  = CELL_CLASS[s]  || 's-na';
          var bcls = BADGE_CLASS[s] || 'badge-na';
          var lbl  = BADGE_LABEL[s] || s;
          var dot  = (s !== 'N/A') ? '<span class="badge-dot"></span>' : '';
          html += '<td class="' + cls + '"><span class="badge ' + bcls + '">' + dot + lbl + '</span></td>';
        });
        html += '</tr>';
      });
      html += '</tbody></table>';
      html += '</div></div>';

      main.innerHTML = html;
    }

    // ── Helpers ───────────────────────────────────────────────────────────────
    function pill(dotCls, num, lbl) {
      return '<div class="stat-pill"><span class="dot ' + dotCls + '"></span>' +
             '<span class="stat-num">' + num + '</span>' +
             '<span class="stat-lbl">&nbsp;' + lbl + '</span></div>';
    }

    function worstStatus(statuses) {
      var worst = null, worstRank = 99;
      Object.values(statuses || {}).forEach(function(s) {
        var r = STATUS_ORDER[s];
        if (r !== undefined && r < worstRank) { worstRank = r; worst = s; }
      });
      return worst;
    }

    function renderError(title, detail) {
      document.getElementById('hero-title').textContent = 'Group not found';
      document.getElementById('hero-meta').innerHTML = '';
      document.getElementById('stats-strip').innerHTML = '';
      document.getElementById('main').innerHTML =
        '<div class="state-msg"><strong>' + escHtml(title) + '</strong>' + (detail || '') + '</div>';
    }

  }());
  </script>
</body>
</html>
